<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligence OS</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color-scheme:light dark}body{margin:0;background:#0d1117;color:#e6edf3}.wrap{padding:16px}.brand{display:flex;justify-content:space-between;align-items:center}.badge{font-size:11px;border:1px solid #30363d;border-radius:999px;padding:5px 8px;color:#8b949e}.card{margin-top:12px;border:1px solid #30363d;background:#161b22;border-radius:14px;padding:13px}.title{font-size:12px;color:#8b949e;text-transform:uppercase;letter-spacing:.08em}.page{font-weight:650;margin-top:7px;line-height:1.35}button{width:100%;margin-top:8px;background:#238636;color:#fff;border:0;border-radius:9px;padding:10px;cursor:pointer}.secondary{background:#21262d}textarea{width:100%;box-sizing:border-box;margin-top:8px;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:9px;padding:9px}.muted{color:#8b949e;font-size:12px;line-height:1.5}.answer{white-space:pre-wrap;font-size:13px;line-height:1.55}.mem{border-top:1px solid #21262d;padding:8px 0}.mem:first-child{border:0}</style></head><body><div class="wrap"><div class="brand"><b>Intelligence OS</b><span class="badge" id="status">CORE?</span></div>
<div class="card"><div class="title">Current Context</div><div id="page" class="page">読み込み中…</div><div id="url" class="muted"></div><button id="remember">このページを記憶</button></div>
<div class="card"><div class="title">Think</div><textarea id="q" rows="4" placeholder="このページや過去Memoryについて聞く"></textarea><label class="muted" style="display:flex;gap:7px;align-items:flex-start;margin-top:8px"><input id="allowResearch" type="checkbox" style="margin-top:3px">Sensitive/高リスクの質問で、この1回だけ外部Web検索を許可</label><label class="muted" style="display:flex;gap:7px;align-items:flex-start;margin-top:8px"><input id="allowReasoning" type="checkbox" style="margin-top:3px">Sensitiveな質問で、この1回だけ外部LLM推論を許可（Secretは送信不可）</label><button id="ask">考える</button><div id="answer" class="answer muted" style="margin-top:10px">必要なMemoryを検索してから考えます。</div></div>
<div class="card"><div class="title">Attention</div><div id="attention" class="muted">loading…</div><button class="secondary" id="consoleBtn">Consoleを開く</button><button class="secondary" id="settingsBtn">設定</button></div></div><script src="sidepanel.js"></script></body></html>
