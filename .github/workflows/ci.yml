name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall -q backend desktop native_host scripts
      - name: Unit and regression tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Version synchronization
        env:
          PYTHONPATH: backend
        run: python scripts/verify_version_sync.py
      - name: Kernel benchmark
        env:
          PYTHONPATH: backend
        run: python scripts/benchmark_kernel.py
      - name: Red Team benchmark
        env:
          PYTHONPATH: backend
        run: python scripts/benchmark_redteam.py
      - name: Development governance benchmark
        env:
          PYTHONPATH: backend
        run: python scripts/benchmark_development_governance.py
      - name: Scenario simulations
        env:
          PYTHONPATH: backend
        run: |
          python scripts/simulate_kernel.py
          python scripts/simulate_current_research.py
          python scripts/simulate_http_research.py
          python scripts/simulate_outcome_learning.py
          python scripts/simulate_http_learning.py
          python scripts/simulate_cognitive_guardrails.py
          python scripts/simulate_observability.py
          python scripts/simulate_useful_automation.py
