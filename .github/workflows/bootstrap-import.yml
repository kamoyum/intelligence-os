name: Bootstrap canonical v0.7.2-alpha source

on:
  push:
    branches: ["main"]
    paths:
      - "intelligence-os-v0.7.2-alpha-github.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bootstrap archive
        id: archive
        shell: bash
        run: |
          if [ -f intelligence-os-v0.7.2-alpha-github.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap archive is not present; nothing to import."
          fi

      - name: Verify canonical archive hash
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          echo "c69abb49f7f69e18b4dbaa71539cb907d3d75a59d889b18bb032dabdfd5d8e12  intelligence-os-v0.7.2-alpha-github.zip" | sha256sum -c -

      - name: Extract and validate source tree
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          rm -rf /tmp/intelligence-os-import
          mkdir -p /tmp/intelligence-os-import
          unzip -q intelligence-os-v0.7.2-alpha-github.zip -d /tmp/intelligence-os-import
          count="$(find /tmp/intelligence-os-import -type f | wc -l | tr -d ' ')"
          test "$count" = "138"
          cd /tmp/intelligence-os-import
          python scripts/public_repo_audit.py

      - name: Replace repository with canonical source
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          rsync -a --delete --exclude '.git/' /tmp/intelligence-os-import/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "release: publish Intelligence OS v0.7.2-alpha"
          git push origin HEAD:main
