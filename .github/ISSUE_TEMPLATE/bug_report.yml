name: Bug report
description: Report a reproducible functional problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, tokens, patient data, private logs, or other sensitive information. Security-sensitive concerns—including authentication bypass, secret leakage, unauthorized external transmission, Native Messaging or localhost boundary violations, unsafe automation, and authority bypass—must follow [SECURITY.md](../../SECURITY.md), not a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.7.2-alpha
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or output
      description: Remove tokens, credentials, personal data, private content, and exploit details.
